# Early Compass under /compass. Include inside a server block:
#   www / production   (sites-available/shichida): API on 127.0.0.1:8090, root /var/www/shichida-admin
#   staging            (sites-available/staging):  API on 127.0.0.1:8091, root /var/www/shichida-admin-staging
# Change the port in the proxy_pass lines for staging. nginx picks the longest matching prefix, so
# these win over the admin app's "location /".
#
# Note the trailing slash on /compass/r/: without it the portal's own /compass/reference page
# would be sent to the API.

location = /compass {
    return 301 /compass/;
}

location /compass/api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    # Saving an assessment renders the PDF before answering.
    proxy_read_timeout 120s;
}

# Parents' report links (no sign-in; signed, expiring tokens)
location /compass/r/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /compass/healthz {
    proxy_pass http://127.0.0.1:8090;
}

# The staff portal: built into the admin app's release as compass/ by the frontend workflow.
# The file names carry a content hash, so they can be cached forever; a missing one is a real 404
# rather than the portal's HTML, which would otherwise be run as JavaScript.
location ^~ /compass/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /compass/ {
    try_files $uri $uri/ /compass/index.html;
}

# Never cached, so staff get the new portal as soon as it is released.
location = /compass/index.html {
    add_header Cache-Control "no-cache";
}
